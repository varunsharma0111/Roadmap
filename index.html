<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn how modern AI systems are built, connected, deployed, secured, monitored, and operated in production.">
  <title>AI Engineering & Production Systems Roadmap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- LEFT SIDEBAR NAVIGATION -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="brand-dot"></span>
          <span class="sidebar-title">Architecture Index</span>
        </div>
        <button class="sidebar-close-btn" id="sidebar-close" aria-label="Close Sidebar">✕</button>
      </div>

      <div class="sidebar-content" id="sidebar-nav">
        <!-- Rendered dynamically via JS -->
      </div>
    </aside>

    <!-- SIDEBAR OVERLAY FOR MOBILE VIEW -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="main-wrapper">
      
      <!-- HEADER SECTION -->
      <header class="header">
        <!-- MOBILE NAVIGATION TOGGLE -->
        <div class="mobile-nav-bar">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
            <span>Navigation Index</span>
          </button>
        </div>

        <div class="header-main">
          <div class="header-brand">
            <h1 class="header-title">AI Engineering & Production Systems Roadmap</h1>
            <p class="header-subtitle">
              Learn how modern AI systems are built, connected, deployed, secured, monitored, and operated in production.
            </p>
            <div class="header-stats-pills">
              <span class="stat-pill"><span class="stat-num">53</span> Core Topics</span>
              <span class="stat-pill"><span class="stat-num">13</span> Categories</span>
              <span class="stat-pill"><span class="stat-num">4</span> Technical Domains</span>
            </div>
          </div>

          <div class="header-actions">
            <button id="btn-theme-toggle" class="btn-theme-toggle-header" aria-label="Toggle Theme">
              <span class="theme-icon">🌙</span>
              <span class="theme-text">Dark</span>
            </button>
          </div>
        </div>
      </header>

      <!-- STICKY CONTROL TOOLBAR -->
      <section class="controls-bar">
        <div class="controls-wrapper">
          
          <div class="controls-search-row">
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
              <input type="text" id="search-input" class="search-input" placeholder="Filter by topic, concept, or tool (e.g., LLM, RAG, Kafka, Docker)...">
              <button id="search-clear" class="search-clear" aria-label="Clear Search">✕</button>
            </div>

            <select id="category-select" class="select-control" aria-label="Filter by Category">
              <option value="all">All Categories</option>
            </select>

            <button id="btn-toggle-all" class="btn-action-outline">
              Expand All
            </button>

            <button id="btn-export" class="btn-action-outline">
              Export Summary
            </button>
          </div>

          <div class="results-counter" id="results-counter"></div>
        </div>
      </section>

      <!-- MAIN ROADMAP CONTENT LIST -->
      <main id="roadmap-content" class="roadmap-content">
        <!-- Dynamically generated category sections & expandable topic lists -->
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <p><strong>AI Engineering & Production Systems Roadmap</strong> — Practical Learning Reference</p>
      </footer>

    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="data.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
